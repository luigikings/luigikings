<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img"><title>Neon section divider</title><style><![CDATA[.run{animation:run 4.5s ease-in-out infinite}@keyframes run{0%{transform:translateX(-160px)}100%{transform:translateX(1200px)}}.pad{transform-origin:600px 12px;animation:pad 3s ease-in-out infinite}@keyframes pad{0%,100%{opacity:.55;transform:rotate(45deg) scale(.85)}50%{opacity:1;transform:rotate(45deg) scale(1.1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#00d4ff" stop-opacity="0"/><stop offset=".15" stop-color="#00d4ff"/><stop offset=".5" stop-color="#c04bff"/><stop offset=".85" stop-color="#ff8c1a"/><stop offset="1" stop-color="#ff8c1a" stop-opacity="0"/></linearGradient><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#c04bff" stop-opacity="0"/><stop offset=".5" stop-color="#c04bff"/><stop offset="1" stop-color="#c04bff" stop-opacity="0"/></linearGradient><filter id="gl" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#gl)"><rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#ln)" fill-opacity=".8"/><rect class="run" x="0" y="10" width="160" height="4" rx="2" fill="url(#fl)"/><rect class="pad" x="594" y="6" width="12" height="12" rx="2" fill="#ff8c1a" fill-opacity=".25" stroke="#ff8c1a" stroke-width="1.5"/></g></svg>